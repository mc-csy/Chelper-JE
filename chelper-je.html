<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CHelper-JE（单文件版） · 我的世界 Java 版命令助手</title>
<meta name="description" content="CHelper-JE 我的世界 Java 版命令助手：命令补全、语法结构、参数说明、错误提示。作者：元宝">
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-size: 15px;
  font-family: Inter, "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "微软雅黑", Arial, sans-serif;
  background: #ffffff;
  color: #000000;
}

.app {
  display: grid;
  grid-template-rows: auto 1fr auto auto;
  height: 100vh;
  height: calc(var(--vh, 1vh) * 100);
}

/* ---------- 顶部信息区 ---------- */
.header { padding: 4px 5px 0 5px; }

.brand {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 6px 5px 2px 5px;
}
.brand-name { font-size: 16px; font-weight: 600; }
.brand-sub { font-size: 12px; color: #888; }

.box {
  padding: 10px;
  margin: 5px 5px 0 5px;
  border-radius: 5px;
  background-color: #f5f7fa;
  white-space: pre-wrap;
  word-break: break-all;
  line-height: 1.5;
}
.box-structure { color: #000000; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; }
.box-hint { color: #555555; font-size: 13px; }
.box-error { color: #ff4444; font-size: 13px; }

.ver-line {
  padding: 6px 10px 2px 10px;
  font-size: 12px;
  color: #888888;
}

.line { margin: 8px 10px 4px 10px; height: 1px; background: #e3e6ea; }

/* ---------- 补全列表 ---------- */
main {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0 5px 5px 5px;
}

.sug {
  padding: 6px 8px;
  margin: 0 0 5px 0;
  background-color: #f5f7fa;
  border-radius: 5px;
  cursor: pointer;
}
.sug:active { background-color: #e8ebf0; }
.sug-name { color: #000000; font-size: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.sug-desc { color: #777777; font-size: 12px; margin-top: 2px; }

/* 参数占位项：只作说明，不参与补全 */
.sug-static { cursor: default; background-color: #eef1f5; }
.sug-static:active { background-color: #eef1f5; }
.sug-static .sug-name { color: #0fa0c8; }
.sug-static .sug-desc { color: #8a9099; }
.sug-tag {
  float: right;
  font-size: 10px;
  color: #ffffff;
  background: #c2c8d0;
  border-radius: 3px;
  padding: 1px 5px;
  margin-left: 6px;
}
.empty-tip { padding: 20px; text-align: center; color: #aaaaaa; font-size: 13px; }

/* ---------- 底部输入区 ---------- */
footer { padding: 0 5px 6px 5px; }

.input-row {
  display: grid;
  grid-template-columns: auto auto 1fr auto;
  gap: 5px;
  align-items: stretch;
  margin-bottom: 6px;
}

.btn {
  border: 0;
  min-width: 48px;
  padding: 0 10px;
  height: 40px;
  color: #ffffff;
  background: #007bff;
  border-radius: 5px;
  cursor: pointer;
  font-size: 14px;
}
.btn:active { background: #005fcc; }
.btn-ghost { background: #9aa5b1; }
.btn-ghost:active { background: #7d8894; }
.btn-wide { width: 100%; background: #0fa0c8; }
.btn-wide:active { background: #0c829f; }
.btn-wide.hot { background: #ff8c1a; }

.editor-shell {
  position: relative;
  min-height: 40px;
  background: #ffffff;
  border: 0;
  border-radius: 5px;
  outline: 1px solid #d0d4d9;
  overflow: hidden;
}
.editor-shell:focus-within { outline: 2px solid #007bff; }

.highlight {
  position: absolute;
  inset: 0;
  padding: 9px 10px;
  line-height: 22px;
  white-space: pre-wrap;
  word-break: break-all;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 15px;
  pointer-events: none;
  overflow: hidden;
  will-change: transform;
}

#cmdInput {
  position: relative;
  display: block;
  width: 100%;
  min-height: 40px;
  max-height: 112px;
  padding: 9px 10px;
  margin: 0;
  border: 0;
  outline: 0;
  resize: none;
  background: transparent;
  color: transparent;
  caret-color: #000000;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 15px;
  line-height: 22px;
  white-space: pre-wrap;
  word-break: break-all;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
#cmdInput::selection { background: #b3d4ff; }
#cmdInput::placeholder { color: #b6bcc4; }
#cmdInput:focus::placeholder { color: #c8cdd4; }

.foot-note {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: #aaaaaa;
  padding: 0 6px;
}

/* ---------- 版本弹窗 ---------- */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  z-index: 50;
}
.modal.show { display: flex; align-items: center; justify-content: center; }

.modal-box {
  width: min(92vw, 340px);
  background: #ffffff;
  border-radius: 10px;
  padding: 16px;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
}
.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.modal-head h3 { margin: 0; font-size: 15px; }
.modal-close {
  border: 0; background: none; font-size: 22px; color: #555; cursor: pointer; padding: 0 4px;
}
.modal-item {
  display: block;
  width: 100%;
  text-align: left;
  border: 0;
  border-radius: 6px;
  padding: 10px;
  margin-bottom: 8px;
  background: #f5f7fa;
  cursor: pointer;
}
.modal-item.on { background: #007bff; }
.modal-item.on .mi-name, .modal-item.on .mi-note { color: #ffffff; }
.mi-name { display: block; font-size: 14px; color: #000; }
.mi-note { display: block; font-size: 11px; color: #888; margin-top: 3px; }

</style>
</head>

<div class="app">

    <div class="brand">

    <div class="box box-structure" id="structure">加载中…</div>

    <div class="ver-line"><span id="verNote"></span>　<span id="stat"></span></div>
    <div class="line"></div>
  </div>

  <main id="list"></main>

  <footer>
    <div class="input-row">
      <button class="btn btn-ghost" id="versionBtn">版本</button>

      <div class="editor-shell">

      </div>
      <button class="btn" id="copyBtn">复制</button>
    </div>
    <div class="input-row">
      <button class="btn btn-wide" id="normBtn">中文 → ID（转成可粘贴的命令）</button>
    </div>
    <div class="foot-note">
      <span>点击候选项自动补全　·　Tab 键补全首项</span>
      <span>命令数据来自 Mojang 官方命令树</span>
    </div>
  </footer>

</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle">选择版本</h3>

    <div id="modalList"></div>
  </div>
</div>

<script>

    { id: '1.21.5', name: 'Java 1.21.5 – 1.21.10', note: '游戏规则仍为驼峰命名（doDaylightCycle / doMobSpawning）', remove: ['waypoint'] },

    if (!ver) ver = VERSIONS[0];

    // 跨参数组合搜索：用户把带空格的多词 ID 拆到了两个参数里
    // （如 "waxed oxidized" 被切成 item=waxed、count=oxidized）
    if (main && main.node.arg && main.node.arg.t === 'number' && cur && !/^-?[\d.]/.test(cur)) {
      var prevVal = null, prevSet = null;
      for (var pi = main.pos - 1; pi >= 1; pi--) {
        var pe = main.syn.exp[pi];
        if (!pe) break;
        if (pe.arg) {
          var ps = V.valueSetFor(cmd.id, pe.arg);
          if (ps && toks[pi]) { prevVal = toks[pi].text; prevSet = ps; }
          break;
        }
      }
      if (prevVal && prevSet) {
        V.search(prevSet, prevVal + ' ' + cur, 12).forEach(function (x) {
          col.add('val:' + x.id, {
            title: x.id,
            description: '（' + prevVal + ' ' + cur + '）→ ' + (x.cn || '').split('/')[0],
            kind: 'value', insert: null, score: x.s
          });
        });
      }
    }

    r.suggestions = sortSuggestions(col.items, cur.toLowerCase()).slice(0, 300);

    if (main) {
      r.paramHint = hintFor(cmd, main.node, main.setName, main.lim, otherNames);
    } else {
      r.paramHint = cmd.desc;
    }

    // 结构行：取最长语法
    var best = hits[0].syn;
    for (var m = 1; m < hits.length; m++) if (hits[m].syn.tokens.length > best.tokens.length) best = hits[m].syn;
    r.structure = best.label;

    // 校验已填部分
    validateFilled(r, cmd, best, toks, ci);

    r.segments = buildSegments(toks, best.exp, cmd);
    return r;
  }

  // ---------- 链式命令（execute） ----------
  function analyzeChain(set, cmd, toks, ci, cur, query, r) {
    var i = 1, used = [], inNode = null, partEnt = null, startTok = 1, ok = true;

    while (i < ci) {
      var hit = null, partEntry = null;
      for (var c = 0; c < cmd.chain.length; c++) {
        var e = cmd.chain[c];
        if (walkExact(e.exp, toks, i)) { hit = e; break; }
        // 只填了一半：光标正停在这条子命令中间
        if (!partEntry) {
          var w = walk(e.exp, toks, i, ci, 0);
          if (w && w.p < e.exp.length) partEntry = { e: e, w: w };
        }
      }
      if (hit) {
        used.push(hit);
        i += hit.exp.length;
        if (hit.end) break;
      } else if (partEntry) {
        var pn = partEntry.e.exp[partEntry.w.p];
        inNode = { tok: pn.tok, arg: pn.arg, part: pn.part, n: 1, gsize: pn.gsize };
        partEnt = partEntry.e;
        startTok = i;
        i = ci;
        break;
      } else {
        ok = false;
        break;
      }
    }

    if (!ok) {
      r.errors.push('无法识别的子命令：「' + toks[i].text + '」');
      r.structure = cmd.name + ' ' + used.map(function (u) { return u.label; }).join(' ') + ' …';
      r.paramHint = cmd.desc;
      r.segments = [{ text: toks.map(function (t) { return t.text; }).join(' '), color: C.bad }];
      return r;
    }

    var col = new Collector();
    var main = null;

    if (inNode) {
      var res = collectAt(col, cmd, inNode, query, toks);
      main = { node: inNode, setName: res.setName, lim: res.lim };
      // run 已输入、正在填目标命令
      if (partEnt && partEnt.end) {
        r.structure = cmd.name + ' ' + used.map(function (u) { return u.label; }).join(' ') +
          (used.length ? ' ' : '') + partEnt.label;
        r.paramHint = 'run 之后填写要执行的目标命令';
        if (!cur) {
          set.names.forEach(function (n) {
            var c = set.lookup[n];
            col.add('cmd:' + n, { title: n, description: c.desc, kind: 'command', insert: n });
          });
          main = null; // 保留上面的提示文案
        }
      }
    } else {
      var lastEnd = used.length > 0 && used[used.length - 1].end;
      if (lastEnd) {
        // run 之后：给目标命令名，并提示可继续输入
        r.paramHint = 'run 之后填写要执行的目标命令（可继续输入命令名，会实时补全）';
        r.structure = cmd.name + ' ' + used.map(function (u) { return u.label; }).join(' ') + ' <目标命令>';
        if (cur) {
          set.names.forEach(function (n) {
            if (n.indexOf(cur.toLowerCase()) !== 0) return;
            var c = set.lookup[n];
            col.add('cmd:' + n, { title: n, description: c.desc, kind: 'command', insert: n });
          });
        }
      } else {
        // 子命令起点
        cmd.chain.forEach(function (e) {
          var t0 = e.exp[0];
          var a0 = t0.arg;
          var setName = V.valueSetFor(cmd.id, a0);
          if (setName) {
            addValueCandidates(col, setName, query, a0, 40);
          } else if (!a0) {
            col.add(normName(t0.tok), { title: t0.tok, description: e.desc, kind: 'literal', insert: t0.tok });
          }
        });
        // run 之后也允许继续接修饰子命令
        r.paramHint = cmd.desc + '　（下一步：选择子命令）';
        r.structure = cmd.name + (used.length ? ' ' + used.map(function (u) { return u.label; }).join(' ') : ' …');
      }
    }

    r.suggestions = sortSuggestions(col.items, cur.toLowerCase()).slice(0, 300);
    if (main) r.paramHint = hintFor(cmd, main.node, main.setName, main.lim, null);

    var lastEnd2 = used.length > 0 && used[used.length - 1].end;
    var inRunPartial = !!(inNode && partEnt && partEnt.end);
    if (inRunPartial) {
      if (!cur) r.errors.push('命令不完整：run 之后还要写要执行的命令');
    } else if (!lastEnd2 && used.length > 0) {
      r.errors.push('命令不完整：/execute 必须以 run <命令> 结尾');
    } else if (!lastEnd2 && used.length === 0 && !inNode) {
      r.errors.push('命令不完整：/execute 需要至少一个子命令');
    } else if (lastEnd2 && ci >= toks.length && toks.length === used.reduce(function (a, u) { return a + u.exp.length; }, 1)) {
      r.errors.push('命令不完整：run 之后还要写要执行的命令');
    }

    r.segments = buildChainSegments(toks, cmd, used, inNode, startTok);
    return r;
  }

  function totalWidth(exp) { return exp.length; }

  // ---------- 校验已填部分 ----------
  function validateFilled(r, cmd, best, toks, ci) {
    var lastArgTok = null;
    // 校验范围含光标所在 token（用户已输完的部分都要查）
    for (var pi = 1; pi <= ci && pi < toks.length && pi < best.exp.length; pi++) {
      var e = best.exp[pi];
      var val = toks[pi] ? toks[pi].text : '';
      if (!e.arg) continue;

      // 坐标：逐分量校验，一个参数只报一次
      if (e.arg.t === 'position') {
        if (!/^[~^]?-?\d*(\.\d+)?$/.test(val)) {
          if (lastArgTok !== e.tok) {
            r.errors.push('坐标「' + e.tok + '」需要 3 个值（x y z，可用 ~ 或 ^ 前缀）');
            lastArgTok = e.tok;
          }
        }
        continue;
      }

      var setName = V.valueSetFor(cmd.id, e.arg);
      if (e.arg.opt && e.arg.opt.length) {
        if (e.arg.opt.indexOf(val) === -1) {
          r.errors.push('「' + val + '」不是 ' + e.tok + ' 的合法取值');
        }
      } else if (e.arg.t === 'number') {
        if (!/^-?\d+(\.\d+)?$/.test(val)) {
          r.errors.push(e.tok + ' 需要一个数字，当前是「' + val + '」');
        } else {
          var lim = numericLimit(cmd.id, e.arg, toks);
          if (lim) {
            var n = parseFloat(val);
            if (lim.min !== null && lim.min !== undefined && n < lim.min) {
              r.errors.push(e.tok + ' 不能小于 ' + lim.min + '（当前 ' + val + '）');
            }
            if (lim.max !== null && lim.max !== undefined && n > lim.max) {
              r.errors.push(e.tok + ' 不能大于 ' + lim.max + '（当前 ' + val + '）' + (lim.hint ? '：' + lim.hint : ''));
            }
          }
        }
      } else if (setName && val.indexOf('@') !== 0 && val.indexOf('{') !== 0) {
        if (val.indexOf('#') === 0) {
          // 标签形式：在对应标签值域里查
          var tset = V.tagSetFor(setName);
          var tname = normName(val.slice(1));
          var tinfo = tset ? V.cnOf(tset, tname) : '';
          var thit = tset ? V.search(tset, tname, 1) : [];
          if (tset && !(thit.length && thit[0].id === tname)) {
            r.errors.push('「' + val + '」不是已知的' + (V.META[tset] ? V.META[tset].kind : '标签'));
          }
        } else {
          // 值域校验：英文直接查 ID，中文按名字查（名字可能是 "别名1/别名2"）
          var hit = V.search(setName, val, 8);
          var aliases = hit.length ? (hit[0].cn || '').split('/') : [];
          var okVal = hit.length && (hit[0].id === normName(val) || aliases.indexOf(val) >= 0);
          if (okVal) {
            // 精确命中，放行
          } else if (hit.length > 1) {
            // 多个匹配：说明用户指的是其中某一个，提示从列表选，不算错误
            r.softHints.push('「' + val + '」匹配到 ' + hit.length + ' 项' +
              (V.META[setName] ? V.META[setName].kind : '') + '，请从下方列表选择');
          } else if (hit.length === 1) {
            r.errors.push('「' + val + '」不是精确的' + (V.META[setName] ? V.META[setName].kind : '取值') +
              '，是否要填 ' + hit[0].id + (aliases[0] ? '（' + aliases[0] + '）' : '') + '？');
          } else {
            r.errors.push('「' + val + '」不是已知的' + (V.META[setName] ? V.META[setName].kind : '取值'));
          }
        }
      }
    }
  }

  // ---------- 高亮 ----------
  function buildSegments(toks, exp, cmd) {
    var segs = [];
    for (var i = 0; i < toks.length; i++) {
      var e = i < exp.length ? exp[i] : null;
      var color = C.plain;
      if (i === 0) color = C.cmd;
      else if (!e) color = C.bad;
      else if (!e.arg) color = C.literal;
      else color = argColor(e.arg);
      segs.push({ text: toks[i].text, color: color });
      if (i < toks.length - 1) segs.push({ text: ' ', color: C.plain });
    }
    return segs;
  }

  function buildChainSegments(toks, cmd, used, inNode, startTok) {
    var segs = [], i = 0;
    segs.push({ text: toks[0].text, color: C.cmd });
    i = 1;
    used.forEach(function (u) {
      for (var t = 0; t < u.exp.length; t++) {
        var e = u.exp[t];
        var color = e.arg ? argColor(e.arg) : C.literal;
        segs.push({ text: ' ', color: C.plain });
        segs.push({ text: toks[i] ? toks[i].text : e.tok, color: color });
        i++;
      }
    });
    if (inNode) {
      segs.push({ text: ' ', color: C.plain });
      segs.push({ text: toks[i] ? toks[i].text : '', color: C.arg });
      i++;
    }
    while (i < toks.length) {
      segs.push({ text: ' ', color: C.plain });
      segs.push({ text: toks[i].text, color: C.plain });
      i++;
    }
    return segs;
  }

  // ---------- 中文 → ID 规范化 ----------
  /** 在某个值域里按中文名精确查找 */
  function lookupByCn(setName, q) {
    var list = V.search(setName, q, 5);
    for (var i = 0; i < list.length; i++) {
      if (list[i].cn === q) return list[i];
    }
    return list.length ? list[0] : null;
  }

  /** 把整条命令里的中文参数替换成英文 ID。
   *  返回 { text, replaced: [{from, to, cn}] } */
  function normalize(set, rawText) {
    var text = rawText.replace(/^\s*\//, '');
    var toks = tokenize(text);
    var cmd = set.lookup[normName(toks[0].text)];
    var out = toks.map(function (t) { return t.text; });
    var replaced = [];
    if (!cmd || toks.length < 2) return { text: rawText, replaced: replaced };

    // 建立位置 → 参数 的映射
    var map = {};
    if (cmd.chain) {
      // 链式：逐个 token 判定
      var i = 1;
      while (i < toks.length) {
        var hit = null;
        for (var c = 0; c < cmd.chain.length; c++) {
          if (walkExact(cmd.chain[c].exp, toks, i)) { hit = cmd.chain[c]; break; }
        }
        if (!hit) {
          for (var c2 = 0; c2 < cmd.chain.length; c2++) {
            var w = walk(cmd.chain[c2].exp, toks, i, toks.length, 0);
            if (w && w.p < cmd.chain[c2].exp.length) { hit = cmd.chain[c2]; break; }
          }
        }
        if (!hit) break;
        for (var k = 0; k < hit.exp.length && i + k < toks.length; k++) {
          if (hit.exp[k].arg) map[i + k] = hit.exp[k].arg;
        }
        if (hit.end) { i += hit.exp.length; break; }
        i += hit.exp.length;
      }
    } else {
      // 普通：选一条最匹配的语法
      var best = null, bestScore = -1;
      for (var s = 0; s < cmd.syn.length; s++) {
        var w2 = walk(cmd.syn[s].exp, toks, 1, toks.length);
        if (!w2) continue;
        var sc = cmd.syn[s].exp.length - Math.abs(cmd.syn[s].exp.length - toks.length);
        if (sc > bestScore) { bestScore = sc; best = cmd.syn[s]; }
      }
      if (best) {
        for (var p = 1; p < best.exp.length && p < toks.length; p++) {
          if (best.exp[p].arg) map[p] = best.exp[p].arg;
        }
      }
    }

    for (var idx = 1; idx < toks.length; idx++) {
      var val = toks[idx].text;
      if (/^[\x00-\x7F]+$/.test(val)) continue; // 已是英文
      var setName = null;

      var a = map[idx];
      if (a) setName = V.valueSetFor(cmd.id, a);
      // 字面量位置（如 /gamerule 的规则名）也可能有中文别名
      if (!setName && cmd.id === 'gamerule' && idx === 1) setName = 'gamerule';
      if (!setName) continue;

      var hit2 = lookupByCn(setName, val);
      if (hit2) {
        out[idx] = hit2.id;
        replaced.push({ from: val, to: hit2.id, cn: hit2.cn });
      }
    }

    var newText = out.join(' ');
    if (rawText.charAt(0) === '/') newText = '/' + newText;
    return { text: newText, replaced: replaced };
  }

  global.CHEngine = {
    VERSIONS: VERSIONS,
    DEFAULT_VERSION: DEFAULT_VERSION,
    buildCommandSet: buildCommandSet,
    analyze: analyze,
    normalize: normalize,
    meta: DATA.meta
  };
})(window);

</script>
<script>
/* CHelper-JE 界面逻辑
 * 作者：元宝
 */
(function () {
  'use strict';

  var E = window.CHEngine;
  var $ = function (id) { return document.getElementById(id); };

  var state = {
    set: null,
    versionId: E.DEFAULT_VERSION,
    text: '',
    cursor: 0
  };

  var el = {};

  function init() {
    if (!window.CHELPER_JE_DATA) {
      var st = document.getElementById('structure');
      var ph = document.getElementById('paramHint');
      var eb = document.getElementById('errorBox');
      if (st) st.textContent = '命令数据未能加载';
      if (ph) ph.textContent = '本地打开时同目录的 js 文件可能被浏览器拦截。';
      if (eb) {
        eb.style.display = '';
        eb.textContent = '请使用单文件版 chelper-je.html（样式、引擎、数据全部内联，不依赖任何外部文件）。';
      }
      return;
    }

    el.structure = $('structure');
    el.paramHint = $('paramHint');
    el.errorBox = $('errorBox');
    el.list = $('list');
    el.input = $('cmdInput');
    el.highlight = $('highlight');
    el.versionBtn = $('versionBtn');
    el.copyBtn = $('copyBtn');
    el.clearBtn = $('clearBtn');
    el.modal = $('modal');
    el.modalList = $('modalList');
    el.modalTitle = $('modalTitle');
    el.stat = $('stat');
    el.verNote = $('verNote');

    buildVersionModal();
    loadVersion(state.versionId);

    el.input.addEventListener('input', onInput);
    el.input.addEventListener('keyup', onCursor);
    el.input.addEventListener('click', onCursor);
    el.input.addEventListener('scroll', syncScroll);
    el.input.addEventListener('keydown', onKeyDown);
    // 禁止回车换行（命令只能是一行）
    el.input.addEventListener('beforeinput', function (e) {
      if (e.inputType === 'insertLineBreak' || e.inputType === 'insertParagraph') e.preventDefault();
    });

    el.versionBtn.addEventListener('click', function () {
      el.modal.classList.add('show');
    });
    el.modal.addEventListener('click', function (e) {
      if (e.target === el.modal) el.modal.classList.remove('show');
    });
    $('modalClose').addEventListener('click', function () {
      el.modal.classList.remove('show');
    });
    el.copyBtn.addEventListener('click', doCopy);
    el.normBtn = $('normBtn');
    el.normBtn.addEventListener('click', doNormalize);
    el.clearBtn.addEventListener('click', function () {
      el.input.value = '';
      onInput();
      autoGrow();
      el.input.focus();
    });

    onInput();
    el.input.focus();
  }

  function buildVersionModal() {
    el.modalList.innerHTML = '';
    E.VERSIONS.forEach(function (v) {
      var b = document.createElement('button');
      b.className = 'modal-item';
      b.innerHTML = '<span class="mi-name">' + v.name + '</span><span class="mi-note">' + v.note + '</span>';
      b.addEventListener('click', function () {
        el.modal.classList.remove('show');
        if (v.id !== state.versionId) loadVersion(v.id);
      });
      el.modalList.appendChild(b);
    });
  }

  function loadVersion(id) {
    state.versionId = id;
    state.set = E.buildCommandSet(id);
    el.versionBtn.textContent = '版本';
    el.verNote.textContent = state.set.version.name + '　·　' + state.set.version.note;
    el.stat.textContent = '共 ' + state.set.list.length + ' 条命令';
    onInput();
  }

  function onInput() {
    state.text = el.input.value;
    state.cursor = el.input.selectionStart || 0;
    render();
    autoGrow();
  }

  function onCursor() {
    state.cursor = el.input.selectionStart || 0;
    render();
  }

  function syncScroll() {
    el.highlight.style.transform =
      'translate(' + -el.input.scrollLeft + 'px,' + -el.input.scrollTop + 'px)';
  }

  /** 让输入框高度跟着内容走（1~4 行） */
  function autoGrow() {
    var max = 112;
    el.input.style.height = 'auto';
    var h = el.input.scrollHeight;
    el.input.style.height = Math.min(h, max) + 'px';
    el.input.style.overflowY = h > max ? 'auto' : 'hidden';
    el.highlight.style.height = el.input.style.height;
  }

  function render() {
    var r = E.analyze(state.set, state.text, state.cursor);

    el.structure.textContent = r.structure;

    el.paramHint.textContent = r.paramHint;

    if (r.errors.length === 0) {
      el.errorBox.style.display = 'none';
      el.errorBox.textContent = '';
    } else if (r.errors.length === 1) {
      el.errorBox.style.display = '';
      el.errorBox.textContent = r.errors[0];
    } else {
      el.errorBox.style.display = '';
      el.errorBox.textContent = '可能的错误原因：\n' + r.errors.map(function (e, i) {
        return (i + 1) + '. ' + e;
      }).join('\n');
    }

    renderSuggestions(r.suggestions);
    renderHighlight(r.segments);

    // 软提示（多义匹配）：并入参数提示行，用中性色，不算错误
    if (r.softHints && r.softHints.length) {
      el.paramHint.textContent += '　·　' + r.softHints.join('　·　');
    }

    if (el.normBtn) {
      if (hasCJK(state.text)) el.normBtn.classList.add('hot');
      else el.normBtn.classList.remove('hot');
    }
  }

  function renderSuggestions(list) {
    el.list.innerHTML = '';
    if (!list || list.length === 0) {
      var d = document.createElement('div');
      d.className = 'empty-tip';
      d.textContent = '没有匹配的候选项';
      el.list.appendChild(d);
      return;
    }
    var frag = document.createDocumentFragment();
    var n = Math.min(list.length, 200);
    for (var i = 0; i < n; i++) {
      (function (item) {
        var isStatic = item.kind === 'arg';
        var d = document.createElement('div');
        d.className = isStatic ? 'sug sug-static' : 'sug';
        var t = document.createElement('div');
        t.className = 'sug-name';
        t.textContent = item.title;
        if (isStatic) {
          var tag = document.createElement('span');
          tag.className = 'sug-tag';
          tag.textContent = '待填写';
          t.appendChild(tag);
        }
        var s = document.createElement('div');
        s.className = 'sug-desc';
        s.textContent = item.description || '';
        d.appendChild(t);
        d.appendChild(s);
        if (!isStatic) d.addEventListener('click', function () { applySuggestion(item); });
        frag.appendChild(d);
      })(list[i]);
    }
    el.list.appendChild(frag);
  }

  function renderHighlight(segs) {
    el.highlight.innerHTML = '';
    var frag = document.createDocumentFragment();
    segs.forEach(function (s) {
      var sp = document.createElement('span');
      sp.style.color = s.color;
      sp.textContent = s.text;
      frag.appendChild(sp);
    });
    el.highlight.appendChild(frag);
    syncScroll();
  }

  function applySuggestion(item) {
    var text = el.input.value;
    var toks = text.replace(/^\s*\//, '').split(/\s+/);
    var pos = el.input.selectionStart || 0;

    // 找到光标所在 token 的范围
    var re = /\S+/g, m, start = pos, end = pos;
    while ((m = re.exec(text)) !== null) {
      if (pos >= m.index && pos <= m.index + m[0].length) {
        start = m.index;
        end = m.index + m[0].length;
        break;
      }
    }

    var insert;
    if (item.kind === 'command') {
      insert = item.title.replace(/^\//, '');
    } else if (item.kind === 'arg') {
      return; // 参数占位不插入
    } else {
      insert = item.insert || item.title;
    }

    var before = text.substring(0, start);
    var after = text.substring(end);
    var needSpace = after.length === 0 || after.charAt(0) !== ' ';
    var newText = before + insert + (needSpace ? ' ' : '');
    var newPos = before.length + insert.length + (needSpace ? 1 : 0);

    el.input.value = newText;
    el.input.setSelectionRange(newPos, newPos);
    el.input.focus();
    onInput();
    // 长命令时把光标滚进可视区，避免"后面看不见"
    el.input.scrollTop = el.input.scrollHeight;
    var sl = el.input.scrollWidth - el.input.clientWidth;
    if (sl > 0) el.input.scrollLeft = sl;
    syncScroll();
  }

  function onKeyDown(e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      var first = el.list.querySelector('.sug:not(.sug-static)');
      if (first) first.click();
    }
  }

  function hasCJK(s) {
    return /[㐀-鿿　-〿＀-￯]/.test(s);
  }

  function doNormalize() {
    var v = el.input.value;
    if (!v) return;
    var res = E.normalize(state.set, v);
    if (!res.replaced.length) {
      el.normBtn.textContent = '没有需要转换的中文';
      setTimeout(function () { resetNormBtn(); }, 1200);
      return;
    }
    el.input.value = res.text;
    var n = res.replaced.length;
    el.normBtn.textContent = '已转换 ' + n + ' 处';
    setTimeout(function () { resetNormBtn(); }, 1200);
    onInput();
    el.input.focus();
  }

  function resetNormBtn() {
    el.normBtn.textContent = '中文 → ID（转成可粘贴的命令）';
  }

  function doCopy() {
    var v = el.input.value;
    if (!v) return;
    var done = function () {
      var old = el.copyBtn.textContent;
      el.copyBtn.textContent = '已复制';
      setTimeout(function () { el.copyBtn.textContent = old; }, 900);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(v).then(done, fallback);
    } else {
      fallback();
    }
    function fallback() {
      el.input.select();
      try { document.execCommand('copy'); done(); } catch (err) { alert('复制失败，请手动选择复制'); }
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>
</body>
</html>
